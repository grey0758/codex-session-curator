events {}

pid /home/grey/data/apps/codex-session-curator-blue-green/nginx/nginx.pid;

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/grey/data/apps/codex-session-curator-blue-green/nginx/logs/access.log;
    error_log /home/grey/data/apps/codex-session-curator-blue-green/nginx/logs/error.log warn;
    client_body_temp_path /home/grey/data/apps/codex-session-curator-blue-green/nginx/client-body;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /home/grey/data/apps/codex-session-curator-blue-green/nginx/upstream.conf;

    server {
        listen 127.0.0.1:54177;
        server_name codex-session-curator.local;

        location / {
            proxy_pass http://curator_live;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }
    }
}
